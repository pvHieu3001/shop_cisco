version: "3.8"

services:
  backend:
    build: .
    image: online-wooden-backend::v1.0.1
    container_name: online-wooden-backend
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - /var/www/uploads:/app/uploads
    networks:
      - wooden-network
networks:
  wooden-network:
    driver: bridge
