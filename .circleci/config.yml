version: 2.1

executors:
  wooden-node-executor:
    docker:
      - image: cimg/node:20.19.0
    working_directory: ~/project/online-wooden
  wooden-java-executor:
    docker:
      - image: cimg/openjdk:17.0
    working_directory: ~/project/online-wooden
  wooden-docker-executor:
    docker:
      - image: docker:24.0.2
    working_directory: ~/project/online-wooden

jobs:
  build-wooden-fe:
    executor: wooden-node-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-fe-{{ checksum "fe/package.json" }}
            - v1-dependencies-fe-
      - run:
          name: Clean and install dependencies
          command: |
            cd fe
            rm -rf node_modules package-lock.json
            npm cache clean --force
            npm install --legacy-peer-deps
      - save_cache:
          paths:
            - fe/node_modules
          key: v1-dependencies-fe-{{ checksum "fe/package.json" }}
      - run:
          name: Verify Vite installation
          command: cd fe && npx vite --version
      - run:
          name: Build FE
          command: cd fe && npx vite build
      - persist_to_workspace:
          root: fe
          paths:
            - dist
  test-wooden-fe:
    executor: wooden-node-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-fe-{{ checksum "fe/package.json" }}
            - v1-dependencies-fe-
      - run:
          name: Install dependencies (if cache miss)
          command: |
            cd fe
            if [ ! -d "node_modules" ]; then
              rm -rf node_modules package-lock.json
              npm cache clean --force
              npm install --legacy-peer-deps
            fi
      - run:
          name: Test FE
          command: cd fe && npm test || true
  build-wooden-be:
    executor: wooden-java-executor
    steps:
      - checkout
      - run:
          name: Grant execute permission for mvnw
          command: cd be && chmod +x mvnw
      - run:
          name: Build BE
          command: cd be && ./mvnw clean install -DskipTests
      - persist_to_workspace:
          root: be
          paths:
            - target
            - dockerfile
            - docker-compose.yml
            - pom.xml
            - src
  test-wooden-be:
    executor: wooden-java-executor
    steps:
      - checkout
      - run:
          name: Grant execute permission for mvnw
          command: cd be && chmod +x mvnw
      - run:
          name: Test BE
          command: cd be && ./mvnw test
  deploy-wooden-fe:
    executor: wooden-node-executor
    steps:
      - checkout
      - attach_workspace:
          at: fe
      - add_ssh_keys:
          fingerprints:
            - "SHA256:2ddCb9OOC47UzX27NS3G1bHd5FeEFd7MD4++MtqCBQY"
      - run:
          name: Deploy Frontend to Server
          command: |
            # Create deployment script
            cat > deploy-online-wooden-fe.sh \<< 'EOF'
            #!/bin/bash
            set -e
            set -x

            # Server configuration from environment variables
            SERVER_HOST="${SERVER_HOST:-your-server.com}"
            SERVER_USER="${SERVER_USER:-deploy}"
            WOODEN_FRONTEND_PATH="${FRONTEND_PATH:-/var/www/html/online-wooden/fe}"
            BACKUP_PATH="${BACKUP_PATH:-/var/www/backups}"

            echo "🚀 Starting frontend deployment to ${SERVER_HOST}..."

            # Create frontend directory if it doesn't exist
            ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "mkdir -p ${WOODEN_FRONTEND_PATH}"

            # Upload new frontend build
            echo "📤 Uploading new frontend build..."
            scp -o StrictHostKeyChecking=no -r fe/dist/* ${SERVER_USER}@${SERVER_HOST}:${WOODEN_FRONTEND_PATH}/

            # Set proper permissions
            ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "chmod -R 755 ${WOODEN_FRONTEND_PATH}"

            # Restart nginx if it exists
            if ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "systemctl is-active --quiet nginx"; then
              echo "🔄 Restarting nginx..."
              ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "sudo systemctl reload nginx"
            fi

            echo "✅ Frontend deployment completed successfully!"
            EOF

            chmod +x deploy-online-wooden-fe.sh
            ./deploy-online-wooden-fe.sh
  deploy-wooden-be:
    executor: wooden-java-executor
    steps:
      - checkout
      - attach_workspace:
          at: be
      - add_ssh_keys:
          fingerprints:
            - "SHA256:2ddCb9OOC47UzX27NS3G1bHd5FeEFd7MD4++MtqCBQY"
      - run:
          name: Verify workspace contents
          command: |
            echo "Current directory: $(pwd)"
            echo "Directory contents:"
            ls -la
            echo "Target directory contents:"
            ls -la target/ || echo "Target directory not found"
      - run:
          name: Deploy Backend to VPS
          command: |
            # Create deployment script
            cat > deploy-online-wooden-be.sh \<< 'EOF'
            #!/bin/bash
            set -e
            set -x

            # Server configuration from environment variables
            SERVER_HOST="${SERVER_HOST:-your-server.com}"
            SERVER_USER="${SERVER_USER:-deploy}"
            WOODEN_BACKEND_PATH="${BACKEND_PATH:-/var/www/html/online-wooden/be}"
            DATABASE_PATH="/var/www/html/online-wooden/database"
            WOODEN_DOCKER_IMAGE_NAME="${DOCKER_IMAGE_NAME:-online-wooden-backend}"
            WOODEN_DOCKER_IMAGE_TAG="${DOCKER_IMAGE_TAG:-v2.0.0}"
            WOODEN_DOCKER_CONTAINER_NAME="${DOCKER_CONTAINER_NAME:-online-wooden-backend}"
            DB_NAME="${DB_NAME:-online_wooden}"
            DB_USER="${DB_USER:-user}"
            DB_PASSWORD="${DB_PASSWORD:-password}"

            echo "🚀 Starting backend deployment to ${SERVER_HOST}..."

            # Create database directory if it doesn't exist
            ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "mkdir -p ${DATABASE_PATH}"

            # Find the JAR file (fix path)
            JAR_FILE=$(find be/target -name "*.jar" -not -name "*sources.jar" -not -name "*javadoc.jar" | head -1)

            if [ -z "$JAR_FILE" ]; then
              echo "❌ No JAR file found in be/target directory"
              echo "be/target directory contents:"
              ls -la be/target/ || echo "be/target directory not found"
              exit 1
            fi

            echo "📦 Found JAR file: $JAR_FILE"

            # Create backend directory if it doesn't exist
            ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "mkdir -p ${WOODEN_BACKEND_PATH}"

            # Backup database
            ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "
              cd ${DATABASE_PATH} && \\ 
              git pull "
            ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "
              if systemctl is-active --quiet mysql; then
                echo '✅ MySQL service is running. Creating backup...'
                mysqldump -u\"${DB_USER}\" -p\"${DB_PASSWORD}\" \"${DB_NAME}\" | gzip > ${DATABASE_PATH}/db_backup.sql.gz
                echo '✅ Database backup completed successfully.'
              else
                echo '🤔 MySQL service is not running or not found. Skipping backup.'
              fi
            "

            # Stop and remove current container if it exists
            if ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "docker ps -a | grep -q ${WOODEN_DOCKER_CONTAINER_NAME}"; then
              echo "🛑 Stopping and removing current container..."
              ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "docker stop ${WOODEN_DOCKER_CONTAINER_NAME} || true"
              # ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "docker images | grep '<none>' | awk '{print $3}' | xargs -r docker rmi"
            fi

            # Remove old Docker image
            ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "docker rmi ${WOODEN_DOCKER_IMAGE_NAME}:${WOODEN_DOCKER_IMAGE_TAG} || true"

            # Upload entire backend directory with existing Docker files
            echo "📤 Uploading backend files..."
            scp -o StrictHostKeyChecking=no be/target/online-wooden-0.0.1-SNAPSHOT.jar ${SERVER_USER}@${SERVER_HOST}:${WOODEN_BACKEND_PATH}/target/online-wooden-0.0.1-SNAPSHOT.jar

            # Run new container with docker-compose
            echo "🚀 Starting new container with docker-compose..."
            ssh -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "cd ${WOODEN_BACKEND_PATH} && SPRING_PROFILES_ACTIVE=docker docker compose -p online-wooden up -d --build"

            echo "✅ Backend deployment completed successfully!"
            EOF

            chmod +x deploy-online-wooden-be.sh
            ./deploy-online-wooden-be.sh

workflows:
  version: 2
  build-and-test:
    jobs:
      - build-wooden-fe
      - test-wooden-fe:
          requires:
            - build-wooden-fe
      - build-wooden-be
      - test-wooden-be:
          requires:
            - build-wooden-be
      - deploy-wooden-fe:
          requires:
            - build-wooden-fe
          filters:
            branches:
              only: develop
      - deploy-wooden-be:
          requires:
            - build-wooden-be
          filters:
            branches:
              only: develop
